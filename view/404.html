<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Page Not Found</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#f4f4f4;
    }

    .container{
        text-align:center;
    }

    h1{
        font-size:120px;
        color:#ff4d4d;
    }

    p{
        font-size:22px;
        margin:10px 0 20px;
        color:#555;
    }

    button{
        padding:12px 24px;
        border:none;
        background:#007bff;
        color:white;
        font-size:16px;
        border-radius:5px;
        cursor:pointer;
    }

    button:hover{
        background:#0056b3;
    }
</style>
</head>
<body>

<div class="container">
    <h1>404</h1>
    <p>Oops! Page Not Found</p>
    <button onclick="goHome()">Go Home</button>
</div>

<script>
function goHome() {
    window.location.href = "/";
}
</script>

</body>
</html>
